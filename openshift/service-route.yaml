apiVersion: v1
kind: Service
metadata:
  name: ekart
spec:
  selector:
    app: ekart
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ekart
spec:
  to:
    kind: Service
    name: ekart
  port:
    targetPort: http
  tls:
    termination: edge
